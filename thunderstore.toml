[config]
schemaVersion = "0.0.1"

[package]
namespace = "Avariiiprime"
name = "ValuableParry"
description = "Parry enemy melee and laser attacks with a held Valuable. Timing + coverage + sacrifice. No E = fully vanilla."
websiteUrl = "https://github.com/layfhaker/parry-mod"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./package/RepoValuableParry.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]

[publish.categories]
repo = ["mods", "misc"]
